<!DOCTYPE html>
<html>
<head>
    <title>学生一覧</title>
</head>
<body>
	<h1>学生一覧</h1>
	<a href="/add-student">学生追加</a>
	<table border="1">

	    <tr>
	        <th>ID</th>
	        <th>名前</th>
	        <th>年齢</th>
	        <th>Email</th>
	    </tr>

	    <tr th:each="student : ${students}">
	        <td th:text="${student.id}"></td>
	        <td th:text="${student.name}"></td>
	        <td th:text="${student.age}"></td>
	        <td th:text="${student.email}"></td>
	    </tr>

	</table>
</body>
</html>
